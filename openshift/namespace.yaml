apiVersion: v1
kind: Namespace
metadata:
  name: instanton-demo
  labels:
    # Pod Security Admission "restricted" rejects the capabilities and the
    # unconfined seccomp profile InstantOn needs to restore. This label applies
    # only to the test project. The SCC still refuses privileged containers.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
    # Keep the syncer from writing "restricted" back over these labels.
    security.openshift.io/scc.podSecurityLabelSync: "false"
  annotations:
    openshift.io/description: "Open Liberty InstantOn restore test"
